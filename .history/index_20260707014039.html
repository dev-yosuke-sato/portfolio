        const</script><div class="fixed inset-0 z-[100] flex items-center justify-center p-4 md:p-8 opacity-0 pointer-events-none transition-all duration-300" id="project-modal">
<div class="absolute inset-0 bg-surface-dim/60 backdrop-blur-md" id="modal-backdrop"></div>
<div class="relative bg-surface-container-lowest w-full max-w-4xl max-h-[90vh] overflow-y-auto rounded-xl shadow-xl transform scale-95 transition-transform duration-300">
<button class="absolute top-4 right-4 z-10 flex items-center gap-2 px-4 py-2 bg-surface-container-high hover:bg-surface-variant rounded-full text-on-surface transition-colors" id="close-modal">
<span class="material-symbols-outlined">close</span>
<span class="font-label-md">閉じる</span>
</button>
<div class="flex flex-col md:flex-row">
<div class="md:w-1/2 h-64 md:h-auto">
<img alt="" class="w-full h-full object-cover" id="modal-image" src="">
</div>
<div class="md:w-1/2 p-8 md:p-12 flex flex-col">
<div class="flex flex-wrap gap-2 mb-6" id="modal-tags"></div>
<h3 class="font-display text-headline-lg text-on-surface mb-4" id="modal-title"></h3>
<div class="text-on-surface-variant space-y-4 mb-10" id="modal-description"></div>
<div class="mt-auto">
<a class="inline-flex items-center gap-3 px-8 py-4 bg-primary text-on-primary rounded-full font-bold text-lg shadow-lg hover:shadow-xl transition-all" href="#" id="modal-link" target="_blank">
                        サイトを見る
                        <span class="material-symbols-outlined">open_in_new</span>
</a>
</div>
</div>
</div>
</div>
</div><script>
(function() {
    const modal = document.getElementById('project-modal');
    const modalContent = modal.querySelector('.relative');
    const closeBtn = document.getElementById('close-modal');
    const backdrop = document.getElementById('modal-backdrop');
    
    const openModal = (data) => {
        document.getElementById('modal-title').textContent = data.title;
        document.getElementById('modal-image').src = data.image;
        document.getElementById('modal-image').alt = data.title;
        document.getElementById('modal-description').innerHTML = data.description;
        document.getElementById('modal-link').href = data.link;
        
        const tagsContainer = document.getElementById('modal-tags');
        tagsContainer.innerHTML = '';
        data.tags.forEach(tag => {
            const span = document.createElement('span');
            span.className = 'px-3 py-1 bg-primary/10 text-primary rounded-full text-label-md font-bold';
            span.textContent = tag;
            tagsContainer.appendChild(span);
        });

        modal.classList.remove('opacity-0', 'pointer-events-none');
        modalContent.classList.remove('scale-95');
        document.body.style.overflow = 'hidden';
    };

    const closeModal = () => {
        modal.classList.add('opacity-0', 'pointer-events-none');
        modalContent.classList.add('scale-95');
        document.body.style.overflow = '';
    };

    document.querySelectorAll('[data-project]').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.preventDefault();
            const data = JSON.parse(btn.getAttribute('data-project'));
            openModal(data);
        });
    });

    closeBtn.addEventListener('click', closeModal);
    backdrop.addEventListener('click', closeModal);
})();
</script>
